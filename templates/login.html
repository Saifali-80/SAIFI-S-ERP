<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SAIFI'S ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { font-size: 16px; }
        @media (max-width: 768px) { html { font-size: 15px; } }
        @media (max-width: 576px) { html { font-size: 14px; } }
        @media (max-width: 400px) { html { font-size: 13px; } }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Grid */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(102, 126, 234, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #667eea, #764ba2);
            top: -150px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6, #ec4899);
            bottom: -200px;
            right: -150px;
            animation-delay: 2s;
            animation-duration: 10s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #06b6d4, #3b82f6);
            top: 40%;
            left: 60%;
            animation-delay: 4s;
            animation-duration: 12s;
            opacity: 0.3;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 20px) scale(1.1); }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            margin: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo/Brand Section */
        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            box-shadow: 0 20px 40px rgba(102,126,234,0.4);
            animation: pulseGlow 2s ease-in-out infinite;
            position: relative;
        }

        .brand-icon::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 27px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(8px);
            animation: pulseBlur 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(102,126,234,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 30px 60px rgba(102,126,234,0.6); }
        }

        @keyframes pulseBlur {
            0%, 100% { opacity: 0.5; filter: blur(8px); }
            50% { opacity: 0.8; filter: blur(12px); }
        }

        .brand-icon i {
            font-size: 36px;
            color: white;
        }

        .brand h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #c4b5fd, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Login Card - Premium Glassmorphism */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 45px 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            animation: shimmer 10s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 65px -15px rgba(0,0,0,0.4);
        }

        /* Welcome Text */
        .welcome-text {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome-text h2 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b, #4f46e5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .welcome-text p {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        /* Input Groups - Premium Style */
        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            transition: all 0.3s;
            z-index: 1;
        }

        .input-field input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        .input-field input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }

        .input-field input:focus + i {
            color: #667eea;
            transform: translateY(-50%) scale(1.1);
        }

        /* Login Button - Premium Gradient */
        .login-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -8px rgba(102,126,234,0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Error Message - Premium Alert */
        .error-message {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-left: 5px solid #ef4444;
            padding: 14px 18px;
            border-radius: 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: shake 0.5s ease;
            box-shadow: 0 4px 15px rgba(239,68,68,0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-message i {
            color: #ef4444;
            font-size: 20px;
        }

        .error-message span {
            color: #b91c1c;
            font-size: 13px;
            font-weight: 600;
        }

        /* Footer Links */
        .footer-links {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 2px solid rgba(102,126,234,0.1);
        }

        .footer-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            color: #764ba2;
            transform: translateX(5px);
        }

        /* Demo Credentials - Premium Card */
        .demo-credentials {
            margin-top: 20px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(102,126,234,0.2);
            transition: all 0.3s;
        }

        .demo-credentials:hover {
            border-color: rgba(102,126,234,0.5);
            box-shadow: 0 4px 12px rgba(102,126,234,0.1);
        }

        .demo-credentials p {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .demo-credentials p i {
            color: #667eea;
            margin-right: 5px;
        }

        .demo-credentials code {
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: #4f46e5;
            margin: 0 4px;
            display: inline-block;
        }

        /* Additional Polish */
        .input-field input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-text h2 { font-size: 1.5rem; }
            .brand h1 { font-size: 1.8rem; }
            .brand p { font-size: 0.8rem; }
            .login-container { max-width: 420px; }
        }
        @media (max-width: 640px) {
            .login-card { padding: 35px 28px; border-radius: 28px; }
            .welcome-text h2 { font-size: 1.4rem; }
            .brand h1 { font-size: 1.6rem; }
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
                border-radius: 24px;
            }
            .welcome-text h2 {
                font-size: 1.3rem;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .brand-icon {
                width: 60px;
                height: 60px;
            }
            .brand-icon i {
                font-size: 26px;
            }
            .input-field input { padding: 12px 14px 12px 42px; font-size: 0.85rem; }
            .input-field i { font-size: 16px; left: 14px; }
            .login-btn { padding: 12px; font-size: 0.9rem; }
            .orb-1, .orb-2, .orb-3 {
                display: none;
            }
        }
        @media (max-width: 400px) {
            .login-card { padding: 24px 16px; border-radius: 20px; }
            .welcome-text h2 { font-size: 1.1rem; }
            .brand h1 { font-size: 1.2rem; }
            .brand-icon { width: 50px; height: 50px; }
            .brand-icon i { font-size: 22px; }
            .input-group { margin-bottom: 16px; }
            .input-label { font-size: 0.75rem; }
            .input-field input { padding: 10px 12px 10px 38px; font-size: 0.8rem; border-radius: 14px; }
            .input-field i { font-size: 14px; left: 12px; }
            .login-btn { padding: 10px; font-size: 0.8rem; border-radius: 14px; }
            .demo-credentials { padding: 10px; }
            .demo-credentials code { font-size: 0.65rem; padding: 3px 8px; }
            .footer-links a { font-size: 0.75rem; }
        }

        /* Loading Animation for Button */
        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .login-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animated Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <!-- Brand Section -->
        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-chart-line"></i>
            </div>
            <h1>SAIFI'S ERP</h1>
            <p>Enterprise Resource Planning</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="welcome-text">
                <h2>Welcome Back</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <!-- Error Message -->
            {% if form.errors %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Invalid username or password. Please try again.</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" id="loginForm">
                {% csrf_token %}
                
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>


    <!-- Optional: Loading State Script (Doesn't change functionality) -->
    <script>
        document.getElementById('loginForm')?.addEventListener('submit', function(e) {
            const btn = document.getElementById('loginBtn');
            if (btn) {
                btn.classList.add('loading');
                btn.innerHTML = '<i class="fas fa-spinner"></i> Signing In...';
            }
        });
    </script>
</body>
</html>
