{% extends 'base.html' %}
{% block content %}
<h2>{% if task %}Edit{% else %}Add{% endif %} Task</h2>
<form method="post">
    {% csrf_token %}
    Title: <input name="title" value="{{ task.title|default:'' }}"><br>
    Description: <textarea name="description">{{ task.description|default:'' }}</textarea><br>
    Campaign: <select name="campaign">
        {% for c in campaigns %}
        <option value="{{ c.id }}" {% if task.campaign.id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
    </select><br>
    Priority: <select name="priority">
        <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
        <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
        <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
    </select><br>
    Status: <select name="status">
        <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>Pending</option>
        <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
        <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
    </select><br>
    Due Date: <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d'|default:'' }}"><br>
    <button type="submit">Save</button>
</form>
{% endblock %}
